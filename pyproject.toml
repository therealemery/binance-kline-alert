[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-kline-alert"
version = "0.1.0"
description = "Binance K-line pattern & LLM natural-language alert bot for Telegram & WeCom"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jiacheng Jiang" }]
requires-python = ">=3.11"
keywords = ["binance", "kline", "trading", "alert", "telegram", "wecom", "deepseek", "llm", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx[socks]>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "wecom-aibot-sdk>=1.0.8",
]

[project.urls]
Homepage = "https://github.com/therealemery/binance-kline-alert"
Repository = "https://github.com/therealemery/binance-kline-alert"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
binance-alert = "binance_alert.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
